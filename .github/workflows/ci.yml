name: CI/CD Pruebas de Integracion

# 1. Se ejecuta con push o pull request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Permisos necesarios para que el test-reporter publique los resultados en GitHub
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Cambia a '21' si tu proyecto usa Java 21
          distribution: 'temurin'
          cache: 'maven'

      # 2. Dar permisos de ejecución a Maven Wrapper
      - name: Dar permisos a Maven
        run: chmod +x mvnw

      # 3. Compilar el proyecto
      - name: Compilar el proyecto
        run: ./mvnw compile --no-transfer-progress

      # 4. Ejecutar los tests de integración
      - name: Ejecutar los tests
        run: ./mvnw verify --no-transfer-progress

      # 5. Generar informe de resultados con GitHub-test-reporter
      - name: Generar Reporte de Tests
        uses: dorny/test-reporter@v1
        if: success() || failure() # Se ejecuta aunque algún test falle
        with:
          name: Resultados de Pruebas
          path: 'target/surefire-reports/*.xml, target/failsafe-reports/*.xml'
          reporter: java-junit

      # 6. Generar Badge de Cobertura con Jacoco
      - name: Generar Badge de Jacoco
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv

      # 7. Subir el badge generado al repositorio
      - name: Subir Badge al repositorio
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .github/badges/jacoco.svg
          git commit -m "Actualizar badge de cobertura de código" || echo "No hay cambios en la cobertura"
          git push